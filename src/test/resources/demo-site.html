<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QA Demo Login</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, Helvetica, sans-serif;
            color: #172337;
            background: #f3f6fa;
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            padding: 48px 20px;
            display: grid;
            place-items: center;
        }
        main {
            width: min(100%, 520px);
            padding: clamp(22px, 5vw, 34px);
            border: 1px solid #d7e0eb;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 14px 36px rgb(23 35 55 / 8%);
        }
        h1 { margin: 0 0 10px; font-size: clamp(1.45rem, 4vw, 1.9rem); }
        .intro { margin: 0 0 24px; color: #526174; line-height: 1.55; }
        label { display: block; margin: 16px 0 7px; font-weight: 600; }
        input {
            display: block;
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #9baabd;
            border-radius: 8px;
            background: #fff;
            color: inherit;
            font: inherit;
        }
        input:focus-visible, button:focus-visible {
            outline: 3px solid #86cfc5;
            outline-offset: 2px;
        }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px 16px;
            border: 0;
            border-radius: 8px;
            background: #087f70;
            color: white;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
        button:hover { background: #06695d; }
        #message { min-height: 24px; margin: 18px 0 0; line-height: 1.5; }
        #message[data-status="error"] { color: #b42318; }
        #message[data-status="success"] { color: #087443; }
        .demo-note { margin-top: 22px; padding-top: 14px; border-top: 1px solid #e6ebf2; color: #526174; font-size: .9rem; line-height: 1.5; }
        @media (max-width: 420px) {
            body { padding: 22px 14px; }
            main { border-radius: 12px; }
        }
    </style>
</head>
<body>
<main>
    <h1>Demo account sign-in</h1>
    <p class="intro">This local page is a safe test target for the automation framework.</p>
    <form id="loginForm">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password">
        <button type="submit" id="loginButton">Sign in</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
    <p class="demo-note">Demo-only credentials: <strong>qa-demo</strong> / <strong>Passw0rd!</strong>. This is not a real authentication service.</p>
</main>
<script>
    document.getElementById("loginForm").addEventListener("submit", function (event) {
        event.preventDefault();
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        const message = document.getElementById("message");

        if (!username || !password) {
            message.textContent = "Please enter both username and password.";
            message.dataset.status = "error";
            return;
        }

        if (username === "qa-demo" && password === "Passw0rd!") {
            message.textContent = "Welcome, qa-demo!";
            message.dataset.status = "success";
        } else {
            message.textContent = "Invalid username or password.";
            message.dataset.status = "error";
        }
    });
</script>
</body>
</html>
